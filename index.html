<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dot Tycoon — 顔からドット絵</title>
    <meta name="description" content="写真から髪・肌・服の色や髪型、メガネなどの特徴を読み取り、16×16 のドット絵キャラに描き直します。処理はすべてブラウザ内で完結します。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23cfe0ff'/%3E%3Crect x='4' y='2' width='8' height='4' fill='%234f8ef7'/%3E%3Crect x='4' y='6' width='8' height='6' fill='%23ffe3cf'/%3E%3C/svg%3E" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="top">
      <h1>Dot Tycoon</h1>
      <p>写真から<strong>特徴</strong>（髪・肌・服の色、髪型、表情、メガネ）を読み取って、16×16 のドット絵に描き直します。画像はこのブラウザの外には送信されません。</p>
    </header>

    <main class="layout">
      <section class="card" aria-labelledby="h-src">
        <h2 id="h-src">1. 写真</h2>
        <label class="drop" id="drop">
          <input id="file" type="file" accept="image/*" />
          <span id="drop-text">ここに画像をドロップ、またはクリックして選択<br /><small>貼り付け（Ctrl/⌘+V）も使えます</small></span>
        </label>
        <div class="stage" id="stage" hidden>
          <canvas id="src-canvas"></canvas>
          <canvas id="overlay-canvas"></canvas>
        </div>
        <label class="inline" id="overlay-toggle" hidden>
          <input type="checkbox" id="overlay" /> 解析結果（顔の範囲・髪/肌/服の領域）を重ねる
        </label>
        <p id="status" class="status" role="status" aria-live="polite">モデルを準備しています…</p>
      </section>

      <section class="card" aria-labelledby="h-out">
        <h2 id="h-out">2. ドット絵</h2>
        <div class="preview">
          <canvas id="dot" width="16" height="16" aria-label="変換後のドット絵"></canvas>
        </div>
        <div class="save">
          <label>形式
            <select id="format"></select>
          </label>
          <label>倍率
            <select id="scale">
              <option value="1">1×（16px）</option>
              <option value="4">4×（64px）</option>
              <option value="8">8×（128px）</option>
              <option value="16" selected>16×（256px）</option>
              <option value="32">32×（512px）</option>
              <option value="64">64×（1024px）</option>
            </select>
          </label>
          <button id="download" type="button" disabled>保存</button>
        </div>
      </section>

      <section class="card wide" aria-labelledby="h-feat">
        <h2 id="h-feat">3. 読み取った特徴 <small>（直接直せます）</small></h2>
        <form id="features" class="features" autocomplete="off"></form>
        <p class="actions"><button id="reset" type="button" disabled>自動検出に戻す</button></p>
        <pre id="debug" class="debug" hidden></pre>
      </section>
    </main>
  </body>
</html>
